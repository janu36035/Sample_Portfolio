<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact - MediaVerse</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>MediaVerse</h1>

        <p>Stories Beyond Words</p>

    </header>


    <nav>

        <a href="index.html">Home</a>

        <a href="blog.html">Blog</a>

        <a href="gallery.html">Gallery</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

    </nav>


    <main>

        <section class="contact">

            <h2>Contact Us</h2>

            <p>
                Have a question or want to share your
                feedback? Send us a message.
            </p>


            <form>

                <!-- Name -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required>


                <!-- Email -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>


                <!-- Subject -->

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required>


                <!-- Category -->

                <label for="category">
                    Message Category
                </label>

                <select id="category"
                        name="category">

                    <option value="">
                        Select a category
                    </option>

                    <option value="feedback">
                        Feedback
                    </option>

                    <option value="suggestion">
                        Suggestion
                    </option>

                    <option value="question">
                        Question
                    </option>

                </select>


                <!-- Message -->

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message..."
                    required></textarea>


                <!-- Submit -->

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 MediaVerse
        </p>

    </footer>

</body>

</html>
